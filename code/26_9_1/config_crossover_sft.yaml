# Crossover-only SFT：正式运行时由 CLI 指定独立 data-dir/run-dir。
base: config_multitask_title_rationale_sft.yaml

experiment:
  name: mevo_llama2_7b_crossover_only_sft

crossover_sft:
  # 正式输入固定为 1 个 greedy + 4 个 sampling Parent。只生成这 4 个，
  # 不做 best-of-N 过采样、语义筛 B 或 Teacher Gold 门控。
  # Llama2 Base 在含 Parent 的标题 Prompt 上分布较尖锐；适度提高采样温度，
  # 让四个采样候选提供差异。仍不按概率或 Gold 排名这些候选。
  temperature: 1.1
  top_p: 0.95
  sample_parent_count: 4
  total_parent_count: 5
  sampling_batch_size: 4
  max_new_tokens: 64
  checkpoint_every: 20
  # 每个训练 Query：一个完整候选集合样本 + 一个随机保留 2--4 个候选的样本。
  # Validation/Test 始终使用完整有效候选集合。
  candidate_dropout_copies: 1

sft_data:
  supervision_mode: plain_output_only
  maximum_history_records: 8
  validation_fraction: 0.05

training:
  trace_loss_weight: 0.0
  output_loss_weight: 1.0
  # Llama2-7B 原生上下文为 4096。SFT 包含 Prompt+Gold；推理自动为
  # max_new_tokens 预留空间，并与训练统一使用保留头尾的截断方式。
  max_length: 4096
  batch_size: 1
  gradient_accumulation_steps: 16
  epochs: 2
  learning_rate: 0.0002
