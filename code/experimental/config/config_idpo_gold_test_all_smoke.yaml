splits:
  adaptation_test:
    processed_split: perpcs_idpo_gold_test_all_smoke_adaptation_test

teacher:
  provider: mock
  model: mock-test-all
  cache_dir: /tmp/mevo_idpo_gold_test_all_smoke_teacher_v1

idpo:
