base: config_s2.yaml

experiment:
  name: perpcs_s2_atomic_trace_full_v1

pipeline:
  run_gpu: true
  run_user_adaptation: false

splits:
  train:
    partition: base
    processed_split: perpcs_s2_full_train
    limit: 0
  validation:
    partition: reserve
    processed_split: perpcs_s2_full_validation
    limit: 0
  test:
    partition: test
    processed_split: perpcs_s2_full_test
    limit: 0

paths:
  sft_dir: dataset/editor_sets/perpcs_s2_atomic_trace_full_v1
  editor_output_dir: result/perpcs_s2_atomic_trace_editor_full_v1
  scorer_data_dir: dataset/ranker_sets/perpcs_s2_atomic_trace_full_v1
  scorer_output_dir: result/perpcs_s2_atomic_trace_scorer_full_v1
  user_scorer_output_dir: result/perpcs_s2_atomic_trace_user_scorer_full_v1
  reports_dir: result/perpcs_s2_atomic_trace_pipeline_full_v1

teacher:
  cache_dir: dataset/cache/perpcs-s2-atomic-trace-full-v1

generation:
  reuse_processed_splits:
    train: perpcs_factor_free_train
    validation: perpcs_factor_free_validation
    test: perpcs_factor_free_test100

atomic_sft:
  cache_dir: dataset/cache/perpcs-s2-atomic-trace-full-v1

